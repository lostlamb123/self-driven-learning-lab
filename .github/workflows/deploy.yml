name: Deploy to GitHub Pages

# 推送到 main 即构建并发布到 GitHub Pages；也支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的最小权限（OIDC 用于 deploy-pages 的凭据交换）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消进行中的旧任务
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 注意：Actions 环境自带 GITHUB_ACTIONS=true，
      # vite.config.ts 据此把 base 切成 /self-driven-learning-lab/
      - name: Type check and build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开启 Pages 时自动开启（Source: GitHub Actions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
